[package]
name = "autorun"
description = "Bluehill Windows NT 5.x Multiboot AIO CD Autorun"
version = "1.0.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-link = "0.100.0"

[build-dependencies]
embed-resource = "3.0.12"
windows-bindgen = "0.100.0"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1

debug = 2
panic = "abort"
